[project]
name = "deployment-in-a-box"
version = "0.1.0"
description = "A voice agent for a fictional Italian utility, deployed the way an FDE would: MCP integration layer, on-policy simulation, KPI tree."
readme = "README.md"
authors = [
    { name = "Luca De Angelis", email = "186620412+LucaDeAng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "mcp>=2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
