id: SIM-meter
title: 'Simulated call: meter (resolved)'
source: simulated
tags:
- auth
- meter
turns:
- user: 'Vorrei comunicare l''autolettura: 45231.'
  expect:
    no_calls:
    - get_bill
    - submit_meter_reading
    say_any:
    - codice cliente
- assistant: Certo. Mi dice il codice cliente e la data di nascita dell'intestatario?
- user: C-1042, nato il 12 aprile 1985.
- calls:
  - name: verify_customer
    args:
      customer_id: C-1042
      birth_date: '1985-04-12'
    result:
      verified: true
      first_name: Marco
      session_token: C-1042|1794072163|dabdaf2404248ad2c27dd879
- calls:
  - name: submit_meter_reading
    args:
      session_token: C-1042|1794072163|dabdaf2404248ad2c27dd879
      reading: 45231
    result:
      accepted: true
      reading: 45231
  expect:
    say_any:
    - registrat
    escalate: false
- assistant: Autolettura registrata, grazie.
