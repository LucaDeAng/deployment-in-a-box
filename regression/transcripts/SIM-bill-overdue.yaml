  expect:
    no_calls:
    - get_bill
    - submit_meter_reading
    say_any:
    - codice cliente
    say_none:
    - euro
    - scadenza
- assistant: Certo. Mi dice il codice cliente e la data di nascita dell'intestatario?
- user: C-3310, nato il 1 settembre 1958.
- calls:
