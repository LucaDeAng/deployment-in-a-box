      verified: true
      first_name: Antonio
      session_token: C-3310|1794072163|14407477db76e0ce3c849d6d
- calls:
  - name: get_bill
    args:
      session_token: C-3310|1794072163|14407477db76e0ce3c849d6d
    result:
      amount_eur: 132.1
      due_date: '2026-10-30'
      status: overdue
      iban_last4: '2854'
  expect:
    say_any:
    - 132,10
