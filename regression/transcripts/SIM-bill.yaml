  expect:
    no_calls:
    - get_bill
    - submit_meter_reading
    say_any:
    - codice cliente
    say_none:
    - euro
    - scadenza
- assistant: Certo. Mi dice il codice cliente e la data di nascita dell'intestatario?
- user: C-1042, nato il 12 aprile 1985.
- calls:
  - name: verify_customer
    args:
      customer_id: C-1042
      birth_date: '1985-04-12'
    result:
      verified: true
      first_name: Marco
      session_token: C-1042|1794072162|c2ab622954d5c0aa29cd3527
- calls:
  - name: get_bill
    args:
      session_token: C-1042|1794072162|c2ab622954d5c0aa29cd3527
    result:
      amount_eur: 84.3
      due_date: '2026-11-20'
      status: unpaid
      iban_last4: '3456'
  expect:
    say_any:
    - 84,30
    escalate: false
- assistant: L'ultima bolletta è di 84,30 euro, scadenza 2026-11-20, da pagare.
